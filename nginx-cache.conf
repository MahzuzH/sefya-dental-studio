# Sefya Dental Studio — Cache-Control Headers
# Copy ke /opt/sefya/nginx-cache.conf, lalu include di nginx config:
#   include /opt/sefya/nginx-cache.conf;

location = / {
    expires -1;
    add_header Cache-Control "no-cache";
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
}

location /logo-navbar.webp {
    expires 30d;
    add_header Cache-Control "public";
}
