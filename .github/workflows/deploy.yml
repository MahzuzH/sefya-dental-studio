name: Deploy to VPS

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: 43.134.96.192
                  username: ubuntu
                  password: ${{ secrets.VPS_PASSWORD }}
                  script: |
                      cd /opt/mahzuz
                      git fetch --all
                      git reset --hard origin/main
                      cd /opt/mahzuz/backend && go build -o /opt/mahzuz/sefya-api .
                      cd /opt/mahzuz/frontend && npm install && npm run build
                      sudo systemctl restart sefya-api

                      echo "=== Applying nginx site config ==="
                      sudo cp /opt/mahzuz/nginx-site.conf /etc/nginx/sites-available/sefya-dental
                      sudo nginx -t && sudo systemctl reload nginx
                      echo "DONE: nginx reloaded"
