name: Deploy to VPS

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: 43.134.96.192
                  username: ubuntu
                  password: ${{ secrets.VPS_PASSWORD }}
                  script: |
                      cd /opt/mahzuz
                      git fetch --all
                      git reset --hard origin/main
                      cd /opt/mahzuz/backend && go build -o /opt/mahzuz/sefya-api .
                      cd /opt/mahzuz/frontend && npm install && npm run build
                      sudo systemctl restart sefya-api

                      echo "=== Applying nginx site config ==="
                      sudo cp /opt/mahzuz/nginx-site.conf /etc/nginx/sites-available/sefya-dental
                      if sudo nginx -t 2>/dev/null; then
                        sudo systemctl reload nginx
                        echo "OK: nginx reloaded"
                      else
                        echo "WARN: nginx config error, rolling back to HTTP-only"
                        sudo sed -i '/listen 443/,/^\}/d' /etc/nginx/sites-available/sefya-dental
                        sudo sed -i 's/return 301.*/root \/opt\/mahzuz\/frontend\/dist;\n    index index.html;/' /etc/nginx/sites-available/sefya-dental
                        sudo nginx -t && sudo systemctl reload nginx
                        echo "OK: nginx reloaded (HTTP fallback)"
                      fi
